<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OI 3.0 — Case for Change</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ─── DESIGN TOKENS ────────────────────────────────────────────────────── */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --red:#CC0000;--red-h:#A80000;--red-bg:#FDF2F2;--red-br:#F0C8C8;
  --g950:#111;--g900:#1C1C1E;--g800:#2C2C2E;--g700:#3A3A3C;
  --g600:#48484A;--g500:#636366;--g400:#8E8E93;--g300:#AEAEB2;
  --g200:#C7C7CC;--g150:#D1D1D6;--g100:#E5E5EA;--g50:#F2F2F7;--g25:#F9F9FB;
  --amb-bg:#FDF3E7;--amb-br:#E8B66A;--amb-st:#C47C12;--amb-tx:#8A5A12;
  --grn-bg:#E7F6EC;--grn-br:#A9DCB6;--grn-st:#2A9E52;--grn-tx:#17703A;
  --sh-card:0 1px 3px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  --sh-hover:0 4px 20px rgba(0,0,0,.09);
  --chat-w:50vw;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);background:#FFFFFF;color:var(--g950);height:100%;-webkit-font-smoothing:antialiased}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input{font-family:var(--font)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g150);border-radius:2px}

/* ─── SHELL ─────────────────────────────────────────────────────────────── */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.body{display:flex;flex:1;overflow:hidden}
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ─── STEPPER (shared, verbatim) ─────────────────────────────────────────── */
.stepper{background:#fff;border-bottom:1px solid var(--g100);padding:15px 40px 0;flex:none}
.stepper-row{display:flex;align-items:stretch}
.step-item{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;flex:1;cursor:default}
.step-item.s-done,.step-item.s-active{cursor:pointer}
.step-item.s-active{border-bottom:2px solid var(--red);margin-bottom:-1px}
.step-num{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1;color:var(--g300)}
.step-item.s-done .step-num{color:var(--grn-tx)}
.step-item.s-active .step-num{color:var(--red)}
.step-item.s-locked .step-num{color:var(--g200)}
.step-name{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.1;color:var(--g300)}
.step-item.s-done .step-name{color:var(--g700)}
.step-item.s-active .step-name{color:var(--g950)}
.step-item.s-locked .step-name{color:var(--g200)}
.step-sub{font-size:11px;color:var(--g400);letter-spacing:-.01em;line-height:1.25}
.step-item.s-locked .step-sub{color:var(--g200)}
.step-div{width:1px;height:30px;background:var(--g100);flex:none;margin:2px 20px 0;align-self:flex-start}

/* ─── PROCEED BAR (shared, verbatim) ────────────────────────────────────── */
.proceed{position:fixed;bottom:0;left:0;right:var(--chat-w);height:66px;background:#fff;border-top:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;padding:0 40px;z-index:20}
.proc-l{font-size:15px;color:var(--g500)}
.proc-l strong{font-weight:700;color:var(--g950)}
.proc-r{display:flex;gap:10px}
.proc-ghost{height:40px;padding:0 20px;border-radius:8px;font-size:15px;font-weight:600;color:var(--g700);border:1px solid var(--g150);background:#fff;transition:all .12s}
.proc-ghost:hover{border-color:var(--g400)}
.proc-confirm{height:40px;padding:0 24px;border-radius:9999px;font-size:15px;font-weight:600;background:var(--red);color:#fff;display:flex;align-items:center;gap:7px;transition:background .12s}
.proc-confirm:hover{background:var(--red-h)}
.proc-confirm:disabled{background:var(--grn-st);cursor:default}

/* ─── CHAT RESIZE HANDLE (shared, verbatim) ─────────────────────────────── */
.chat-resize-handle{width:4px;background:transparent;cursor:col-resize;flex:none;position:relative;z-index:30;transition:background .15s}
.chat-resize-handle:hover,.chat-resize-handle.dragging{background:var(--g100)}
.chat-resize-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:28px;border-radius:2px;background:var(--g200)}

/* ─── CHAT PANEL (shared, verbatim) ─────────────────────────────────────── */
.chat-panel{width:var(--chat-w);flex:none;background:#FFFFFF;display:flex;flex-direction:column;border-left:1px solid var(--g100);overflow:hidden}
.cp-tabs{display:flex;border-bottom:1px solid var(--g100);flex:none;background:#fff;padding:0 4px}
.cp-tab{height:40px;padding:0 14px;font-size:15px;font-weight:600;color:var(--g400);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.cp-tab.on{color:var(--g950);border-bottom-color:var(--g950)}
.cp-tab:hover:not(.on){color:var(--g700)}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle}
.cp-msgs-wrap{flex:1;overflow-y:auto;padding:20px 16px 0}
.cp-msgs{display:flex;flex-direction:column;gap:11px;padding-bottom:14px}
.c-div{display:flex;align-items:center;gap:8px;margin:2px 0}
.cd-l{flex:1;height:1px;background:var(--g100)}
.cd-t{font-size:12px;color:var(--g300);font-weight:600;white-space:nowrap}
.msg-a{display:flex;flex-direction:column;gap:3px}
.msg-a-b{background:#F7F7F9;border-radius:2px 12px 12px 12px;padding:12px 14px}
.msg-a-t{font-size:14px;color:var(--g700);line-height:1.65}
.msg-a-t strong{font-weight:700;color:var(--g950)}
.msg-tm{font-size:12px;color:var(--g300);margin-top:2px}
.msg-p{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.msg-p-b{background:var(--g950);border-radius:10px 2px 10px 10px;padding:9px 12px;max-width:210px}
.msg-p-t{font-size:14px;color:#fff;line-height:1.6}
.msg-a-meta{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.msg-a-stat-row{display:flex;gap:0;margin-top:8px;border-top:1px solid var(--g100);padding-top:8px}
.msg-a-stat{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 8px}
.msg-a-stat:first-child{padding-left:0}
.msg-a-stat:not(:last-child){border-right:1px solid var(--g100)}
.msg-a-stat-val{font-size:17px;font-weight:700;color:var(--g950);letter-spacing:-.02em}
.msg-a-stat-lbl{font-size:12px;color:var(--g400)}
.msg-flag-wrap{background:var(--amb-bg);border:1.5px solid var(--amb-br);border-radius:12px;padding:12px 14px}
.msg-flag-body{flex:1}
.msg-flag-title{font-size:15px;font-weight:700;color:var(--amb-tx);margin-bottom:5px}
.msg-flag-detail{font-size:14px;color:var(--g500);line-height:1.65;margin-bottom:10px}
.msg-flag-acts{display:flex;gap:8px;flex-wrap:wrap}
.msg-flag-btn-pri{height:32px;padding:0 14px;border-radius:9999px;border:1px solid var(--g300);color:var(--g700);background:#fff;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .12s}
.msg-flag-btn-pri:hover{border-color:var(--g600);color:var(--g950)}
.msg-flag-btn-sec{height:32px;padding:0 14px;border-radius:9999px;border:1px solid var(--g300);color:var(--g700);background:#fff;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .12s}
.cp-sugs{display:flex;gap:5px;overflow-x:auto;padding:8px 13px 2px;scrollbar-width:none;flex:none}
.cp-sug{font-size:11.5px;font-weight:600;color:var(--g500);background:#fff;border:1px solid var(--g150);border-radius:9999px;padding:5px 12px;cursor:pointer;transition:all .12s;font-family:var(--font);white-space:nowrap;flex:none}
.cp-sug:hover{border-color:var(--g400);color:var(--g900)}
.cp-ft{height:66px;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:0 14px;border-top:1px solid var(--g100);flex:none;background:#fff}
.cp-row{display:flex;gap:7px}
.cp-inp{flex:1;height:38px;background:#F6F7F9;border:1px solid var(--g150);border-radius:8px;padding:0 12px;font-size:15px;color:var(--g950);outline:none;transition:border-color .15s}
.cp-inp:focus{border-color:var(--g500)}
.cp-inp::placeholder{color:var(--g300)}
.cp-send{width:38px;height:38px;border-radius:8px;background:var(--g950);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;border:none;transition:all .12s}
.cp-send:hover{background:var(--g950);color:#fff;border-color:var(--g950)}

/* ─── LOG ────────────────────────────────────────────────────────────────── */
.lg-scroll{flex:1;overflow-y:auto;padding:12px}
.lg-list{display:flex;flex-direction:column}
.lg-e{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--g100)}
.lg-e:last-child{border-bottom:none}
.lg-ln{display:flex;flex-direction:column;align-items:center;width:11px;margin-top:3px;flex:none}
.lg-dot{width:7px;height:7px;border-radius:50%;flex:none}
.lg-dot.p{background:var(--red)}.lg-dot.a{background:var(--g400)}.lg-dot.s{background:var(--g200)}.lg-dot.c{background:#2E7FD9}
.lg-con{width:1px;flex:1;background:var(--g100);margin-top:3px}
.lg-b{flex:1}
.lg-who{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.lw-p{color:var(--red)}.lw-a{color:var(--g500)}.lw-s{color:var(--g300)}.lw-c{color:#2E7FD9}
.lg-tx{font-size:14px;color:var(--g700);line-height:1.5}
.lg-tx strong{font-weight:700;color:var(--g950)}
.lg-tm{font-size:12px;color:var(--g300);margin-top:2px}

/* ─── MODAL SYSTEM (shared, verbatim) ───────────────────────────────────── */
.overlay{display:none;position:fixed;top:0;left:0;right:var(--chat-w);bottom:0;z-index:500;background:rgba(0,0,0,.3);backdrop-filter:blur(2px)}
.sh-hd{padding:18px 22px 14px;border-bottom:1px solid var(--g100);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2;border-radius:18px 18px 0 0}
.sh-ey{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--g400);margin-bottom:4px}
.sh-name{font-size:23px;font-weight:700;letter-spacing:-.025em;color:var(--g950);margin-bottom:3px}
.sh-sub{font-size:14px;color:var(--g400)}
.sh-close{width:30px;height:30px;border-radius:50%;background:var(--g50);display:flex;align-items:center;justify-content:center;color:var(--g500);transition:background .12s;flex:none;margin-top:2px}
.sh-close:hover{background:var(--g100);color:var(--g950)}
.sh-body{padding:20px 22px}
.sh-s{margin-bottom:18px}
.sh-sl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--g400);margin-bottom:8px}
.sh-txt{font-size:14px;color:var(--g700);line-height:1.7}
.sh-srcs{display:flex;flex-direction:column;gap:6px}
.sh-src{display:flex;align-items:center;gap:9px;background:#F6F7F9;border-radius:9px;padding:10px 12px;cursor:pointer;transition:background .12s}
.sh-src:hover{background:var(--g100)}
.sh-src-ic{width:26px;height:26px;border-radius:6px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--g500);flex:none}
.sh-src-n{font-size:15px;font-weight:600;color:var(--g950)}
.sh-src-s{font-size:14px;color:var(--g400)}
.sh-src-arr{margin-left:auto;color:var(--g300)}
.audit-block{display:flex;flex-direction:column;gap:12px;padding:16px 22px 20px}
.audit-section{display:flex;flex-direction:column;gap:5px}
.audit-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--g400)}
.audit-label.green{color:var(--grn-tx)}
.audit-val{font-size:14px;color:var(--g700);line-height:1.6;background:var(--g50);border-radius:8px;padding:9px 11px}
.audit-val.highlight{background:var(--grn-bg);border:1px solid var(--grn-br);color:var(--g950);font-weight:700;font-size:15px}

/* ═══════════════════════════════════════════════════════════════════════════
  PAGE-SPECIFIC CSS: MODE SYSTEM
═══════════════════════════════════════════════════════════════════════════ */

/* Mode 1.1 — hide workspace content + proceed bar + chat panel */
body.chat-mode .proceed{display:none!important}
body.chat-mode #mode-ws{display:none!important}

/* Mode 1.2 — hide full-screen chat */
body.workspace-mode #mode-chat{border-left:1px solid var(--g100)}

/* ═══════════════════════════════════════════════════════════════════════════
  PAGE-SPECIFIC CSS: MODE 1.1 — SYNTHESIS CHAT
═══════════════════════════════════════════════════════════════════════════ */
.chat-full{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#FFFFFF}
/* Full-chat tab bar */
.cf-tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--g100);padding:0 20px;flex:none}
.cf-tab{height:42px;padding:0 16px;font-size:15px;font-weight:600;color:var(--g400);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s;background:none;cursor:pointer}
.cf-tab.on{color:var(--g950);border-bottom-color:var(--g950)}
.cf-tab:hover:not(.on){color:var(--g700)}
.cf-alt{flex:1;overflow-y:auto;background:#FFFFFF}
.cf-alt-inner{width:100%;max-width:min(900px,calc(100% - 40px));margin:0 auto;padding:30px 34px}
.cf-attach{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--g500);display:flex;align-items:center;justify-content:center;flex:none;border:1.5px solid var(--g150);transition:all .12s;cursor:pointer}
.cf-attach:hover{background:var(--g50);color:var(--g900);border-color:var(--g300)}
/* Collaborators panel */
.collab-panel{background:#fff;border:1px solid var(--g150);border-radius:12px;padding:12px 13px}
.collab-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.collab-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g500)}
.collab-live{font-size:12px;font-weight:600;color:var(--grn-tx);background:var(--grn-bg);border-radius:9999px;padding:2px 9px}
.collab-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100)}
.collab-row:last-of-type{border-bottom:none}
.collab-av{position:relative;width:30px;height:30px;border-radius:50%;background:var(--g200);color:var(--g700);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.collab-on{position:absolute;bottom:-1px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--grn-tx);border:2px solid #fff}
.collab-main{flex:1;min-width:0}
.collab-nm{font-size:14.5px;font-weight:600;color:var(--g950)}
.collab-role{font-size:12.5px;color:var(--g400)}
.collab-meta{text-align:right;flex:none}
.collab-last{font-size:12.5px;color:var(--g600)}
.collab-edits{font-size:11.5px;color:var(--g300);margin-top:1px}
.collab-foot{font-size:12px;color:var(--g400);line-height:1.5;margin-top:9px;padding-top:9px;border-top:1px solid var(--g100)}
/* Sources */
.src-count{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--g400);margin-bottom:12px}
.src-cat{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g500);margin:16px 0 6px}
.src-cat:first-of-type{margin-top:0}
.src-cat-dot{width:7px;height:7px;border-radius:50%;flex:none}
.src-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--g100)}
.src-ic{width:30px;height:30px;border-radius:7px;background:#fff;border:1px solid var(--g100);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--g500);flex:none}
.src-main{flex:1;min-width:0}
.src-nm{font-size:14px;font-weight:600;color:var(--g950)}
.src-d{font-size:13px;color:var(--g400);margin-top:1px}
.src-date{font-size:12px;color:var(--g300);margin-top:3px}
.src-refresh{width:30px;height:30px;border-radius:7px;border:1px solid var(--g150);background:#fff;color:var(--g400);display:flex;align-items:center;justify-content:center;flex:none;transition:all .12s;cursor:pointer}
.src-refresh:hover{border-color:var(--g400);color:var(--g900)}
.cf-msgs-wrap{flex:1;overflow-y:auto;padding:0;background:transparent}
/* Full-width chat column — messages left or right, no centering constraint */
.cf-msgs{display:flex;flex-direction:column;width:100%;max-width:min(900px,calc(100% - 40px));margin:0 auto;background:transparent;border-radius:0;padding:26px 30px 8px}
/* Agent messages — left aligned, max 65% so they don't span the full width */
.cf-msg-a{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px;max-width:65%;align-self:flex-start}
.cf-avatar{width:28px;height:28px;border-radius:50%;background:var(--g900);display:flex;align-items:center;justify-content:center;flex:none}
.cf-body{flex:1;min-width:0}
.cf-name{font-size:12.5px;font-weight:600;color:var(--g400);margin-bottom:5px;letter-spacing:.01em}
.cf-bubble{background:#F7F7F9;border-radius:18px 18px 18px 4px;padding:14px 17px;font-size:14.5px;color:var(--g900);line-height:1.6}
.cf-bubble p{margin-bottom:9px}.cf-bubble p:last-child{margin-bottom:0}
.cf-bubble strong{font-weight:600;color:var(--g950)}
/* User messages — right aligned */
.cf-msg-p{display:flex;justify-content:flex-end;margin-bottom:16px;align-self:flex-end;max-width:60%}
.cf-bubble-p{background:var(--g950);border-radius:18px 18px 4px 18px;padding:11px 16px;font-size:14.5px;color:#fff;line-height:1.6}
.cf-tm{font-size:13px;color:var(--g300);margin-top:4px;padding:0 2px}
.cf-tm-r{font-size:13px;color:var(--g300);margin-top:4px;text-align:right;padding:0 2px}
/* Stat tiles */
.cf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.cf-stat{background:#F2F2F7;border-radius:12px;padding:12px 14px}
.cf-stat.lead{background:var(--red-bg);border:1px solid var(--red-br)}
/* No serif — consistent normal font throughout */
.cf-stat-val{font-size:23px;font-weight:700;letter-spacing:-.03em;color:var(--g950);margin-bottom:1px}
.cf-stat.lead .cf-stat-val{color:var(--red)}
.cf-stat-lbl{font-size:14px;color:var(--g500);line-height:1.3}
.cf-stat-badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:9999px;margin-top:6px}
.cf-stat-badge.h{background:var(--grn-bg);color:var(--grn-tx)}
.cf-stat-badge.h::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--grn-st)}
.cf-stat-badge.m{background:var(--amb-bg);color:var(--amb-tx)}
.cf-stat-badge.m::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amb-st)}
/* Finding bullets */
.cf-bullet{display:flex;gap:0;border-radius:10px;overflow:hidden;margin-bottom:6px;background:#F2F2F7}
.cf-bullet:last-child{margin-bottom:0}
.cf-bar{width:3px;flex:none}
.cf-bar.h{background:var(--grn-st)}.cf-bar.m{background:var(--amb-st)}.cf-bar.n{background:var(--g300)}
.cf-bi{padding:10px 14px;flex:1}
.cf-bl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.cf-bl.h{color:var(--grn-tx)}.cf-bl.m{color:var(--amb-tx)}.cf-bl.n{color:var(--g500)}
.cf-bt{font-size:15px;color:var(--g700);line-height:1.55}.cf-bt strong{color:var(--g950);font-weight:600}
/* Narrative card */
.cf-narrative-card{background:#F6F7F9;border-radius:12px;border:1px solid var(--g100);padding:16px 18px;margin:8px 0 4px}
.cf-narrative-eyebrow{font-size:12px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}
.cf-narrative-headline{font-size:17px;font-weight:400;color:var(--g950);line-height:1.6;margin-bottom:8px}

.na-title{font-size:19px;font-weight:700;color:var(--g950);letter-spacing:-.015em;line-height:1.25;margin-bottom:7px}
.na-card.selected .na-title{color:var(--nc)}
.na-drill{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-top:1px solid var(--g100);font-size:13.5px;font-weight:600;color:var(--nc);cursor:pointer;transition:background .12s}
.na-drill:hover{background:var(--nc-bg)}
.na-head{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.na-cat{display:flex;align-items:center;gap:9px;margin-right:auto}
.na-cat-ic{width:30px;height:30px;border-radius:9px;background:var(--nc-bg);color:var(--nc);display:flex;align-items:center;justify-content:center;flex:none}
.na-cat-tx{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--nc)}
.na-stat{display:flex;align-items:baseline;gap:8px;margin:4px 0 11px}
.na-stat-num{font-size:23px;font-weight:700;color:var(--nc);letter-spacing:-.02em;line-height:1;flex:none}
.na-stat-lbl{font-size:13.5px;color:var(--g500);line-height:1.35}
.na-metric-line{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
.na-metric-num{font-size:16px;font-weight:700;color:var(--nc);letter-spacing:-.01em}
.na-metric-lbl{font-size:13.5px;color:var(--g500);line-height:1.4}
.na-angle{font-size:14.5px;color:var(--g600);line-height:1.55}
.na-ev{border-top:1px solid var(--g100);padding:15px 18px 17px;display:grid;grid-template-columns:1fr 1fr;gap:18px;background:transparent}
.na-ev-col-hd{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.na-src{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.na-src:last-child{margin-bottom:0}
.na-src-ic{height:17px;padding:0 5px;border-radius:5px;background:#fff;border:1px solid var(--g200);display:flex;align-items:center;justify-content:center;flex:none;font-size:10px;font-weight:700;color:var(--g500);margin-top:1px;letter-spacing:.03em;white-space:nowrap}
.na-src-tx{font-size:14.5px;color:var(--g600);line-height:1.45}
.na-sig{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.na-sig:last-child{margin-bottom:0}
.na-sig-dot{width:5px;height:5px;border-radius:50%;background:var(--nc);flex:none;margin-top:6px}
.na-sig-tx{font-size:14.5px;color:var(--g600);line-height:1.45}
.na-sig-tx strong{color:var(--g950);font-weight:600}
/* skip / later option */
.na-skip{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px dashed var(--g200);border-radius:13px;background:transparent;cursor:pointer;transition:all .15s;margin-top:2px}
.na-skip:hover{border-color:var(--g400);background:#F6F7F9}
.na-skip.selected{border-style:solid;border-color:var(--grn-st);background:var(--grn-bg)}
.na-skip-ic{width:30px;height:30px;border-radius:8px;background:var(--g50);color:var(--g500);display:flex;align-items:center;justify-content:center;flex:none}
.na-skip.selected .na-skip-ic{background:#fff;color:var(--grn-tx)}
.na-skip-tx{flex:1}
.na-skip-t{font-size:15px;font-weight:700;color:var(--g950)}
.na-skip-s{font-size:13.5px;color:var(--g500);line-height:1.4;margin-top:1px}
/* multi-select hint + count */
.na-hint{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--g500);margin:2px 0 12px;line-height:1.45}
.na-hint svg{flex:none}
.na-alt-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g400);margin:16px 0 8px}
.cf-msg-a.wide{max-width:92%}
.cf-msg-a.wide .cf-bubble{width:100%}

/* ══ CASE FOR CHANGE — situation card + ranked framings ══════════════════
   Spacing on a 4pt grid. Type scale: 24/17/15/13.5/12/10.5.
   Colour carries meaning only: red = Nike's position, accent = category. */

/* ── Situation card: verdict + the three numbers behind it ── */
.sit{background:#fff;border:1px solid var(--g150);border-radius:16px;overflow:hidden;margin-bottom:28px}
.sit-hd{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 16px}
.sit-badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;flex:none;margin-top:1px}
.sit-verdict{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--g950);line-height:1.25}
.sit-line{font-size:13.5px;color:var(--g600);line-height:1.55;margin-top:5px}
.sit-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--g100)}
.sit-stat{padding:15px 20px 16px;border-right:1px solid var(--g100);cursor:pointer;position:relative;transition:background .12s;outline:none}
.sit-stat:last-child{border-right:none}
.sit-stat:hover{background:var(--g25)}
.sit-stat:focus-visible{background:var(--g25);box-shadow:inset 0 0 0 2px var(--red)}
.sit-val{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.sit-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);margin-top:7px}
.sit-cmp{font-size:12px;color:var(--g500);margin-top:5px;line-height:1.45}
.sit-cmp b{color:var(--g700);font-weight:700}
.sit-go{display:inline-flex;align-items:center;gap:3px;margin-top:9px;font-size:11px;font-weight:700;color:var(--g300);letter-spacing:.02em;transition:color .12s}
.sit-go svg{width:11px;height:11px;transition:transform .14s}
.sit-stat:hover .sit-go{color:var(--red)}
.sit-stat:hover .sit-go svg{transform:translateX(2px)}

/* ── Section header ── */
.sec-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.sec-t{font-size:17px;font-weight:700;letter-spacing:-.015em;color:var(--g950)}
.sec-c{font-size:12.5px;color:var(--g400)}
.sec-info{width:16px;height:16px;border-radius:50%;border:1px solid var(--g200);color:var(--g400);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:none;position:relative;top:1px;font-family:var(--font)}
.sec-info:hover{border-color:var(--g400);color:var(--g700)}
.sec-sub{font-size:12.5px;color:var(--g400);line-height:1.5;margin-bottom:14px}

/* ── Ranked framing row ── */
.na-wrap{display:flex;flex-direction:column;gap:8px;margin:0 0 4px}
.cfr{display:flex;background:#fff;border:1px solid var(--g150);border-radius:13px;transition:border-color .14s,box-shadow .14s;cursor:pointer;position:relative}
.cfr:hover{border-color:var(--g300);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cfr.selected{border-color:var(--nc);box-shadow:0 0 0 2px var(--nc-bg)}

.cfr-rail{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;padding:14px 0 10px;gap:2px;border-right:1px solid var(--g50)}
.cfr-rank{font-size:19px;font-weight:800;color:var(--g300);letter-spacing:-.03em;line-height:1;transition:color .14s}
.cfr.selected .cfr-rank,.cfr:hover .cfr-rank{color:var(--nc)}
/* Reorder controls are always visible — hiding them until hover made the
   manual re-rank effectively undiscoverable. Bordered so they read as
   buttons at rest, not just glyphs. */
.cfr-arrows{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.cfr-arw{width:22px;height:19px;border:1px solid var(--g200);background:#fff;border-radius:5px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--g500);padding:0;
  transition:background .12s,border-color .12s,color .12s,transform .1s}
.cfr-arw svg{width:10px;height:10px}
.cfr-arw svg path{stroke-width:2.2}
.cfr-arw:hover:not(:disabled){background:var(--g950);border-color:var(--g950);color:#fff}
.cfr-arw:active:not(:disabled){transform:scale(.9)}
.cfr-arw:focus-visible{outline:none;box-shadow:0 0 0 2.5px rgba(26,93,170,.3)}
.cfr-arw:disabled{opacity:.3;cursor:default;background:var(--g25)}

.cfr-body{flex:1;min-width:0;padding:14px 4px 13px 14px}
.cfr-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.cfr-cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--nc)}
.cfr-cat svg{width:13px;height:13px}
.cfr-lead{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--grn-tx);background:var(--grn-bg);padding:2px 7px;border-radius:4px}
.cfr-title{font-size:16.5px;font-weight:700;color:var(--g950);letter-spacing:-.015em;line-height:1.25}
.cfr-metric{font-size:13px;color:var(--g500);margin-top:3px}
.cfr-metric b{color:var(--g950);font-weight:700}
.cfr-take{font-size:13.5px;color:var(--g700);line-height:1.5;margin-top:9px}

/* Agent framing block on the row */
.cfr-framing{margin-top:10px;padding:11px 13px;background:var(--nc-bg);border-radius:9px}
.cfr-framing-l{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--nc);margin-bottom:5px}
.cfr-framing-l svg{width:11px;height:11px}
.cfr-framing-t{font-size:13.5px;color:var(--g700);line-height:1.55}
.cfr-read{display:inline-flex;align-items:center;gap:4px;margin-top:8px;border:none;background:none;padding:0;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--nc);cursor:pointer}
.cfr-read:hover{text-decoration:underline}

/* Named indicators — words carry the meaning, bar is a glance aid */
.cfr-meta{display:flex;align-items:center;gap:18px;margin-top:12px;flex-wrap:wrap}
.cfr-ind{display:flex;flex-direction:column;gap:4px}
.cfr-ind-l{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--g300)}
.cfr-ind-r{display:flex;align-items:center;gap:7px}
.cfr-ind-v{font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.cfr-ind-bar{width:38px;height:3px;border-radius:2px;background:var(--g100);overflow:hidden}
.cfr-ind-fill{height:100%;border-radius:2px}
.cfr-reason{font-size:12px;color:var(--g400);margin-left:auto;padding-right:4px;align-self:flex-end}

/* Selection interplay: a thesis and "explore" are mutually exclusive */
.cfr.superseded{opacity:.45}
.cf-note{display:flex;gap:9px;align-items:flex-start;padding:11px 14px;border-radius:10px;margin:10px 0 2px;background:#EBF3FD;border:1px solid #C3DCF7;color:#1A5DAA;font-size:12.5px;line-height:1.55}
.cf-note svg{width:15px;height:15px;flex:none;margin-top:1px}
.cf-note span{color:var(--g700)}
.cf-note b{color:var(--g950);font-weight:700}
.cf-note.warn{background:#FFF6E5;border-color:#E8CB92;color:#8A5A00}
.cf-note.warn span{color:#6B4400}

/* Selection control — identical to the peers tile and the analysis table:
   circular, tinted when on, dark-green tick, generous hit target. */
.cfr-sel{width:52px;flex:none;display:flex;align-items:flex-start;justify-content:center;padding-top:9px}
.sel-hit{display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
  border:none;background:none;padding:0;border-radius:50%;-webkit-tap-highlight-color:transparent;
  transition:background .15s ease}
.sel-hit:hover{background:rgba(0,0,0,.035)}
.sel-hit:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(23,112,58,.28)}
.sel-hit:active .sel-box{transform:scale(.9)}
.sel-box{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g200);background:transparent;
  display:flex;align-items:center;justify-content:center;flex:none;
  transition:background .16s cubic-bezier(.4,0,.2,1),border-color .16s cubic-bezier(.4,0,.2,1),transform .12s cubic-bezier(.4,0,.2,1)}
.sel-box svg{width:10px;height:10px;opacity:0;transform:scale(.6);
  transition:opacity .14s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
.sel-box svg path{stroke:var(--grn-tx);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.cfr.selected .sel-box{background:var(--grn-bg);border-color:var(--grn-br)}
.cfr.selected .sel-box svg{opacity:1;transform:scale(1)}
.sel-hit:hover .sel-box{border-color:var(--g300)}
.cfr:not(.selected) .sel-hit:hover .sel-box svg{opacity:.28;transform:scale(1)}
.cfr:not(.selected) .sel-hit:hover .sel-box svg path{stroke:var(--g500)}
.cfr.superseded .sel-box{border-color:var(--g150)}
.na-card{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh-card);cursor:pointer;transition:box-shadow .15s,transform .12s;border:1px solid var(--g100);position:relative;padding:0}
.na-card:hover{box-shadow:var(--sh-hover);transform:translateY(-1px);border-color:var(--g150)}
.na-card.selected{border-color:var(--grn-st);box-shadow:0 0 0 2px var(--grn-bg)}
.na-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:2;cursor:pointer;background:transparent;border:1.5px solid var(--g200)}
.na-check:hover{border-color:var(--nc)}
.na-check svg{opacity:0;transition:opacity .12s}
.na-card.selected .na-check{background:var(--grn-bg);border-color:var(--grn-st)}
.na-card.selected .na-check svg{opacity:1}
.na-inner{padding:15px 28px 11px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.na-cat-row{display:flex;align-items:center;gap:7px}
.na-cat-ic{width:22px;height:22px;border-radius:7px;background:var(--nc-bg);color:var(--nc);display:flex;align-items:center;justify-content:center;flex:none}
.na-cat-ic svg{width:12px;height:12px}
.na-cat-tx{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--nc)}
.na-tile-title{font-size:16px;font-weight:700;color:var(--g950);letter-spacing:-.01em;line-height:1.25}
.na-tile-sub{font-size:13px;color:var(--g500);line-height:1.45}
.na-tile-sub strong{color:var(--nc);font-weight:700}
.na-tile-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--g50)}
.na-tile-conf{font-size:12px;font-weight:600;color:var(--g400)}
.na-tile-conf.rec{color:var(--red)}


.cf-split-row{display:flex;flex:1;overflow:hidden;min-height:0}

.share-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--g100)}
.share-title{font-size:18px;font-weight:700;color:var(--g950);letter-spacing:-.01em}
.share-sub{font-size:13.5px;color:var(--g500);margin-top:3px}
.share-close{width:28px;height:28px;border-radius:50%;background:var(--g50);color:var(--g500);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.share-close:hover{background:var(--g100);color:var(--g950)}
.share-add{display:flex;gap:8px;padding:14px 22px}
.share-add input{flex:1;height:36px;border:1px solid var(--g200);border-radius:8px;padding:0 12px;font-size:15px;font-family:var(--font);outline:none}
.share-add input:focus{border-color:var(--g500)}
.share-add select{height:36px;border:1px solid var(--g200);border-radius:8px;padding:0 8px;font-size:14px;font-family:var(--font);background:#fff;cursor:pointer;color:var(--g700)}
.share-add-btn{height:36px;padding:0 16px;border-radius:8px;background:var(--g950);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:var(--font)}
.share-list{padding:0 22px;max-height:280px;overflow-y:auto}
.share-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--g50)}
.share-av{width:32px;height:32px;border-radius:50%;background:var(--g200);color:var(--g700);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.share-main{flex:1;min-width:0}
.share-nm{font-size:15px;font-weight:600;color:var(--g950)}
.share-role{font-size:13px;color:var(--g400)}
.share-permsel{height:30px;border:1px solid var(--g200);border-radius:7px;padding:0 8px;font-size:14px;font-weight:600;font-family:var(--font);background:#fff;cursor:pointer;color:var(--g700)}
.share-rm{width:22px;height:22px;border-radius:6px;border:none;background:none;color:var(--g300);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.share-rm:hover{background:var(--red-bg);color:var(--red)}
.share-ft{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 18px;border-top:1px solid var(--g100)}
.share-link{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--g200);background:#fff;font-size:14px;font-weight:600;color:var(--g700);cursor:pointer;font-family:var(--font)}
.share-link:hover{border-color:var(--g400)}
.share-done{height:34px;padding:0 18px;border-radius:8px;background:var(--red);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font)}
.collab-perm{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:9999px}
.collab-perm.perm-c{background:var(--grn-bg);color:var(--grn-tx)}
.collab-perm.perm-v{background:var(--g100);color:var(--g500)}
.collab-share-btn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:7px;border:1px solid var(--g200);background:#fff;font-size:12.5px;font-weight:600;color:var(--g700);cursor:pointer;font-family:var(--font)}
.collab-share-btn:hover{border-color:var(--g400);color:var(--g950)}


#cf-tiles-scroll{flex:1;min-width:0}
#cf-detail{flex:1 1 0;min-width:0}
#mode-chat{border-left:1px solid var(--g100);flex:1 1 0;min-width:0}

.cf-cta-bar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 28px;border-top:1px solid var(--g100);background:#fff;flex:none}
.cf-skip{background:none;border:none;font-family:var(--font);font-size:14px;font-weight:600;color:var(--g500);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.cf-skip:hover{color:var(--g900)}
.cf-build{height:38px;padding:0 20px;border-radius:9999px;border:none;background:var(--red);color:#fff;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .12s}
.cf-build:hover{opacity:.85}

.cp-sugs{display:flex;gap:5px;overflow-x:auto;padding:8px 13px 2px;scrollbar-width:none;flex:none}
.cp-sugs::-webkit-scrollbar{display:none}
.cp-sug{font-size:11.5px;font-weight:600;color:var(--g500);background:#fff;border:1px solid var(--g150);border-radius:9999px;padding:5px 12px;cursor:pointer;transition:all .12s;font-family:var(--font);white-space:nowrap;flex:none}
.cp-sug:hover{border-color:var(--g400);color:var(--g900)}
.cp-ft{padding:10px 12px;border-top:1px solid var(--g100);flex:none;background:#fff}
.cp-row{display:flex;gap:7px}
.cp-inp:focus{border-color:var(--g500)}
.cp-send{cursor:pointer}
.cp-send:hover{background:var(--g950);color:#fff;border-color:var(--g950)}
.cp-attach{width:38px;height:38px;border-radius:8px;background:var(--g50);color:var(--g500);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--g150);transition:all .12s;cursor:pointer}
.cp-attach:hover{border-color:var(--g400);color:var(--g900)}
.src-upload-zone{border:1.5px dashed var(--g150);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:all .14s;margin-bottom:12px;background:var(--g25)}
.src-upload-zone:hover{border-color:var(--g400);background:var(--g50)}
.src-file-row2{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--g50)}
.src-file-row2:last-child{border-bottom:none}
.src-file-ic2{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex:none}

/* Agent order: strongest combined evidence first. Stable on rank as tiebreak. */
function agentOrder(){
  return ANGLES.slice().sort(function(a,b){
    var sa=(a.qs||0)+(a.ls||0), sb=(b.qs||0)+(b.ls||0);
    return sb!==sa ? sb-sa : (a.rank||99)-(b.rank||99);
  }).map(function(a){return a.id;});
}
function currentOrder(){ return (userOrder||agentOrder()).slice(); }

/* ══ Chart primitives for metric deep-dives ═══════════════════════════════ */
var CH_NS="http://www.w3.org/2000/svg";
function cEl(t,a){var e='<'+t;for(var k in a)e+=' '+k+'="'+a[k]+'"';return e+'/>';}
function cTx(x,y,s,a){var o='<text x="'+x+'" y="'+y+'"';for(var k in (a||{}))o+=' '+k+'="'+a[k]+'"';return o+'>'+s+'</text>';}

/* Indexed multi-series line chart with optional band and event markers */
function lineChart(o){
  var W=o.w||660,H=o.h||300,PL=44,PR=o.pr||96,PT=14,PB=42;
  var iw=W-PL-PR, ih=H-PT-PB;
  var lo=o.yMin, hi=o.yMax, n=o.labels.length;
  var X=function(i){return PL+(i/(n-1))*iw;};
  var Y=function(v){return PT+ih-((v-lo)/(hi-lo))*ih;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;overflow:visible" xmlns="'+CH_NS+'">';
  (o.ticks||[]).forEach(function(t){
    var y=Y(t);
    s+=cEl('line',{x1:PL,y1:y,x2:PL+iw,y2:y,stroke:(t===o.baseAt?'#C7C7CC':'#EDEDF0'),'stroke-width':1,'stroke-dasharray':(t===o.baseAt?'none':'3 4')});
    s+=cTx(PL-8,y+4,t+(o.ySuffix||''),{'font-family':'system-ui','font-size':10.5,fill:'#AEAEB2','text-anchor':'end'});
  });
  o.labels.forEach(function(l,i){
    if(o.labelEvery&&i%o.labelEvery!==0&&i!==n-1)return;
    s+=cTx(X(i),PT+ih+18,l,{'font-family':'system-ui','font-size':10,fill:'#AEAEB2','text-anchor':'middle'});
  });
  if(o.band){
    var a=o.series[o.band[0]].v,bb=o.series[o.band[1]].v,d='';
    a.forEach(function(v,i){d+=(i?'L':'M')+X(i)+','+Y(v);});
    for(var i=bb.length-1;i>=0;i--) d+='L'+X(i)+','+Y(bb[i]);
    s+=cEl('path',{d:d+'Z',fill:o.bandFill||'#CC0000','fill-opacity':.07});
  }
  o.series.forEach(function(se){
    var d='';se.v.forEach(function(v,i){d+=(i?'L':'M')+X(i)+','+Y(v);});
    s+=cEl('path',{d:d,fill:'none',stroke:se.c,'stroke-width':se.w||1.6,'stroke-dasharray':se.dash||'none','stroke-opacity':se.o||1,'stroke-linejoin':'round','stroke-linecap':'round'});
    var lx=X(n-1),ly=Y(se.v[n-1]);
    if(se.lead) s+=cEl('circle',{cx:lx,cy:ly,r:3.4,fill:'#fff',stroke:se.c,'stroke-width':2});
    s+=cTx(lx+8,ly+(se.dy||0)+3.5,se.name,{'font-family':'system-ui','font-size':10.5,'font-weight':(se.lead?700:500),fill:se.c});
    if(se.endLabel) s+=cTx(lx+8,ly+(se.dy||0)+15,se.endLabel,{'font-family':'system-ui','font-size':10,'font-weight':700,fill:se.c,'fill-opacity':.85});
  });
  (o.events||[]).forEach(function(ev){
    var x=X(ev.i);
    s+=cEl('line',{x1:x,y1:PT,x2:x,y2:PT+ih,stroke:'#8E8E93','stroke-width':1,'stroke-dasharray':'2 3','stroke-opacity':.55});
    s+=cEl('circle',{cx:x,cy:PT+2,r:7,fill:'#48484A'});
    s+=cTx(x,PT+5.5,ev.n,{'font-family':'system-ui','font-size':9,'font-weight':700,fill:'#fff','text-anchor':'middle'});
  });
  return s+'</svg>';
}

function eventKey(evts,A){
  return '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g50)">'+

        '<span style="font-size:11.5px;color:var(--g600);line-height:1.45">'+e.t+'</span></div>';
    }).join('')+'</div>';
}

/* Attribution waterfall — what a headline number decomposes into */
function attribChart(rows,total,totalLabel,A){
  var W=660,H=186,PL=8,base=112,span=0,run=0;
  rows.forEach(function(r){run+=r.v; span=Math.max(span,Math.abs(run),Math.abs(r.v));});
  var scale=Math.min(2.6,74/Math.max(span,1));
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;overflow:visible" xmlns="'+CH_NS+'">';
  s+=cEl('line',{x1:PL,y1:base,x2:W-8,y2:base,stroke:'#D1D1D6','stroke-width':1});
  var colW=(W-PL-16)/(rows.length+1);
  run=0;
  rows.forEach(function(r,i){
    var x=PL+colW*i+colW*0.22, bw=colW*0.56;
    var y0=base-run*scale, y1=base-(run+r.v)*scale;
    var top=Math.min(y0,y1), hgt=Math.max(Math.abs(y1-y0),2);
    s+=cEl('rect',{x:x,y:top,width:bw,height:hgt,rx:3,fill:r.v<0?(A||'#CC0000'):'#0D6E3F','fill-opacity':.85});
    s+=cEl('line',{x1:x,y1:y1,x2:x+bw+colW*0.44,y2:y1,stroke:'#C7C7CC','stroke-width':1,'stroke-dasharray':'3 3'});
    s+=cTx(x+bw/2,(r.v<0?top+hgt+14:top-8),(r.v>0?'+':'\u2212')+Math.abs(r.v)+'pp',{'font-family':'system-ui','font-size':11.5,'font-weight':700,fill:r.v<0?(A||'#CC0000'):'#0D6E3F','text-anchor':'middle'});
    r.l.split('\n').forEach(function(p,pi){
      s+=cTx(x+bw/2,base+21+pi*12,p,{'font-family':'system-ui','font-size':10.5,fill:'#636366','text-anchor':'middle'});
    });
    run+=r.v;
  });
  var tx=PL+colW*rows.length+colW*0.22, tw=colW*0.56;
  var ty=base-run*scale, tTop=Math.min(base,ty), tH=Math.max(Math.abs(base-ty),2);
  s+=cEl('rect',{x:tx,y:tTop,width:tw,height:tH,rx:3,fill:'#1C1C1E'});
  s+=cTx(tx+tw/2,(run<0?tTop+tH+14:tTop-8),(run<0?'\u2212':'+')+Math.abs(total)+'pp',{'font-family':'system-ui','font-size':12.5,'font-weight':800,fill:'#1C1C1E','text-anchor':'middle'});
  totalLabel.split('\n').forEach(function(p,pi){
    s+=cTx(tx+tw/2,base+21+pi*12,p,{'font-family':'system-ui','font-size':10.5,'font-weight':700,fill:'#1C1C1E','text-anchor':'middle'});
  });
  return s+'</svg>';
}

function openSitDetail(key){
  var m=SIT_DETAIL[key]; if(!m) return;
  var A=m.accent, ABG=m.accentBg, ABR=m.accentBr, ASOFT=m.accentSoft;

  // Breadcrumb picks up the metric's colour so the page identifies itself
  var cr=document.getElementById("cf-d-crumb");
  if(cr){
    cr.innerHTML='<span style="display:inline-flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:'+A+'"></span>'+
      '<span style="color:'+A+';font-weight:700">'+m.title+'</span></span>';
  }
  var b=document.getElementById("cf-d-body"); if(!b) return;

  // Section label with a colour tick, so sections read as belonging to this metric
  function sec(t,n){
    return '<div style="margin:26px 0 10px">'+
      '<div style="display:flex;align-items:center;gap:7px">'+
        '<span style="width:3px;height:12px;border-radius:2px;background:'+A+'"></span>'+
        '<span style="font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:'+A+'">'+t+'</span>'+
      '</div>'+
      (n?'<div style="font-size:12.5px;color:var(--g500);line-height:1.55;margin-top:6px;max-width:640px">'+n+'</div>':'')+
    '</div>';
  }
  function card(inner,pad){
    return '<div style="background:#fff;border:1px solid '+ABR+';border-radius:12px;padding:'+(pad||'16px 18px')+'">'+inner+'</div>';
  }

  var ev=m.evidence.map(function(s){
    return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--g50)">'+
      '<div style="min-width:48px;height:21px;padding:0 7px;border-radius:5px;background:'+ABG+';color:'+A+';font-size:9.5px;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;flex:none">'+s.ic+'</div>'+
      '<div style="font-size:13px;color:var(--g700);line-height:1.55">'+s.tx+'</div></div>';
  }).join('');

  b.innerHTML=
    // Headline banner, tinted in the metric's colour
    '<div style="display:flex;align-items:flex-start;gap:20px;background:'+ABG+';border:1px solid '+ABR+';border-radius:14px;padding:18px 20px">'+
      '<div style="flex:none;border-right:1px solid '+ABR+';padding-right:20px">'+
        '<div style="font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1;color:'+A+';font-variant-numeric:tabular-nums">'+m.value+'</div>'+
        '<div style="font-size:12px;color:var(--g500);margin-top:8px;max-width:180px;line-height:1.45">'+m.valueLabel+'</div>'+
      '</div>'+
      '<div style="flex:1;min-width:0;padding-top:1px">'+
        '<div style="font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--g950);line-height:1.25">'+m.title+'</div>'+
        '<div style="font-size:14px;color:var(--g700);line-height:1.65;margin-top:8px">'+m.reading+'</div>'+
      '</div>'+
    '</div>'+

    sec(m.chartTitle,m.chartNote)+
    card(m.chart()+(m.chartEvents?eventKey(m.chartEvents,A):''))+

    sec(m.attribTitle,m.attribNote)+
    card(attribChart(m.attrib.rows,m.attrib.total,m.attrib.label,A))+

    sec(m.tableTitle)+
    card(miniTable(m.tableCols,m.tableRows,A,ASOFT),'14px 18px 6px')+

    sec('Why this matters to the case')+
    '<div style="background:#fff;border:1px solid '+ABR+';border-left:3px solid '+A+';border-radius:12px;padding:15px 18px">'+
      '<div style="font-size:14px;color:var(--g700);line-height:1.7">'+m.why+'</div></div>'+

    sec('Evidence behind the number')+
    card(ev,'4px 18px 6px')+

    sec('What to watch for')+
    '<div style="display:flex;gap:11px;align-items:flex-start;background:#FFF6E5;border:1px solid #E8CB92;border-radius:12px;padding:14px 16px">'+
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex:none;margin-top:1px"><path d="M8 1.6l6.4 11.1H1.6z" stroke="#8A5A00" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.4v3M8 11.2h.01" stroke="#8A5A00" stroke-width="1.4" stroke-linecap="round"/></svg>'+
      '<div style="font-size:13px;color:#6B4400;line-height:1.65">'+m.caveat+'</div>'+
    '</div>'+
    '<div style="height:28px"></div>';

  var t=document.getElementById("cf-tiles-scroll"); if(t)t.style.display="none";
  var d=document.getElementById("cf-detail"); if(d)d.style.display="flex";
  var cta=document.querySelector(".cf-cta-bar"); if(cta)cta.style.display="none";
  var sc=document.getElementById("cf-d-scroll"); if(sc)sc.scrollTop=0;
}

function renderAngles(){
  var order=currentOrder();
  var html='<div class="sec-hd">'+
    '<span class="sec-t">Framings</span>'+
    '<span class="sec-c">ranked by strength of evidence</span>'+
    '<span class="sec-info" title="Ranked automatically on two things. Evidence — how defensible the number is from public, sourced data. Client readiness — how primed the client already is for this conversation, read from earnings calls, board signals and leadership language. Use the arrows on any row to re-order.">i</span>'+
    (userOrder?'<button onclick="resetRanking()" style="margin-left:auto;border:none;background:none;font-size:12.5px;color:var(--g500);cursor:pointer;font-family:var(--font);padding:0;text-decoration:underline">Reset order</button>':'')+
  '</div>'+
  '<div class="sec-sub">Pick one, or several to carry forward as scenarios.</div>';

  html+='<div class="na-wrap" id="na-wrap">';
  order.forEach(function(id,i){
    var a=ANGLES.filter(function(x){return x.id===id;})[0];
    if(!a) return;
    var col=ANGLE_COLORS[a.tag]||{st:"var(--g500)",bg:"var(--g50)",br:"var(--g150)"};
    html+='<div class="cfr" id="na-'+a.id+'" style="--nc:'+col.st+';--nc-bg:'+col.bg+'" onclick="openAngleDetail(\''+a.id+'\')">'+

      '<div class="cfr-rail" onclick="event.stopPropagation()">'+
        '<div class="cfr-rank">'+(i+1)+'</div>'+
        '<div class="cfr-arrows">'+
          '<button class="cfr-arw" '+(i===0?'disabled':'')+' title="Move up" onclick="event.stopPropagation();moveAngle(\''+a.id+'\',-1)"><svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 6.25L5 3.25l3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
          '<button class="cfr-arw" '+(i===order.length-1?'disabled':'')+' title="Move down" onclick="event.stopPropagation();moveAngle(\''+a.id+'\',1)"><svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 3.75L5 6.75l3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+
        '</div>'+
      '</div>'+

      '<div class="cfr-body">'+
        '<div class="cfr-eyebrow">'+
          '<span class="cfr-cat">'+(ANGLE_ICONS[a.tag]||'')+a.tag+'</span>'+
          (i===0?'<span class="cfr-lead">Recommended lead</span>':'')+
        '</div>'+
        '<div class="cfr-title">'+a.title+'</div>'+
        '<div class="cfr-metric"><b>'+a.metric+'</b> '+a.metricLabel+'</div>'+
        (a.takeaway?
          '<div class="cfr-framing">'+
            '<div class="cfr-framing-l">'+
              '<svg viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.6v2.9M6 8.3h.01" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'+
              'Agent\'s proposed framing'+
            '</div>'+
            '<div class="cfr-framing-t">'+a.takeaway+'</div>'+
            '<button class="cfr-read" onclick="event.stopPropagation();openAngleDetail(\'' + a.id + '\')">Read the full case'+
              '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M4 2.5L7.5 6L4 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
            '</button>'+
          '</div>':'')+
        '<div class="cfr-meta">'+
          indicator('Evidence', evidenceLabel(a.qs||0), a.qs||0)+
          indicator('Client readiness', readinessLabel(a.ls||0), a.ls||0)+
          (a.rankShort?'<span class="cfr-reason">'+a.rankShort+'</span>':'')+
        '</div>'+
      '</div>'+

      '<div class="cfr-sel">'+
        '<button class="sel-hit" onclick="event.stopPropagation();pickAngle(\''+a.id+'\')" '+
          'aria-pressed="'+(selectedAngles.indexOf(a.id)!==-1?'true':'false')+'" '+
          'title="'+(selectedAngles.indexOf(a.id)!==-1?'Selected \u2014 click to deselect':'Select this framing')+'">'+
          '<span class="sel-box"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5"/></svg></span>'+
        '</button>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';

  html+='<div class="na-alt-label">Not ready to commit to a story?</div>';
  html+='<div class="cf-note" id="cf-auto-note" style="display:none">'+
    '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.1v3.6M8 10.9h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'+
    '<span>Selecting every framing is the same as having no fixed thesis, so this has switched to <b>Explore the full potential</b>. Pick a single framing to go back.</span>'+
  '</div>';
  html+='<div class="cf-note warn" id="cf-clear-warn" style="display:none">'+
    '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.1v3.6M8 10.9h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'+
    '<span></span>'+
  '</div>';
  html+='<div class="na-skip" id="na-explore" onclick="pickDefer(\'explore\')">'+
    '<div class="na-skip-ic"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div>'+
    '<div class="na-skip-tx"><div class="na-skip-t">Explore the full potential</div><div class="na-skip-s">No fixed thesis? I\u2019ll map every opportunity across cost and revenue, and we\u2019ll find the strongest story in the results.</div></div>'+
    '<div class="na-pick"><svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M3 7.5l2.5 2.5L11 4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'+
  '</div>';
  return html;
}

  var B=ANGLE_BENCH[id]; if(!B) return '';

    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--g400);margin-bottom:12px">'+B.title+'</div>'+
    B.rows.map(function(r){var w=Math.max(3,Math.round(Math.abs(r[1])/mx*100)),hi=r[2];

function pickAngle(id){
  // Leaving explore mode: this framing becomes the only selection
  if(deferMode==="explore"){ deferMode=null; selectedAngles=[]; }

  var i=selectedAngles.indexOf(id);
  if(i===-1)selectedAngles.push(id); else selectedAngles.splice(i,1);

  // Every framing selected is the same statement as having no thesis —
  // collapse to Explore rather than leave a selection that means nothing.
  if(selectedAngles.length===ANGLES.length){
    deferMode="explore";
    selectedAngles=[];
    syncSelectionUI(true);
    return;
  }
  deferMode=null;
  syncSelectionUI(false);
}

/* Single place reconciling selection state with the DOM.
   autoNote=true reveals the explanation for the auto-collapse. */
function syncSelectionUI(autoNote){
  var exploring = deferMode==="explore";
  document.querySelectorAll(".cfr").forEach(function(c){
    var cid=c.id.replace("na-","");
    var on=selectedAngles.indexOf(cid)!==-1;
    c.classList.toggle("selected", on);
    c.classList.toggle("superseded", exploring);
    var btn=c.querySelector(".sel-hit");
    if(btn){
      btn.setAttribute("aria-pressed", on?"true":"false");
      btn.title = on ? "Selected \u2014 click to deselect" : "Select this framing";
    }
  });
  var ex=document.getElementById("na-explore");
  if(ex) ex.classList.toggle("selected", exploring);

  // Warn what selecting explore will cost, rather than refusing the click
  var warn=document.getElementById("cf-clear-warn");
  if(warn){
    var n=selectedAngles.length;
    if(n>0 && !exploring){
      warn.style.display="flex";
      warn.querySelector("span").innerHTML='Selecting this will deselect your <b>'+n+' chosen framing'+(n>1?'s':'')+'</b>.';
    } else {
      warn.style.display="none";
    }
  }
  var note=document.getElementById("cf-auto-note");
  if(note) note.style.display = (exploring && autoNote) ? "flex" : "none";

  updateCFCta();
}

function pickDefer(mode){
  // Selecting "explore" means starting without a thesis, so any chosen
  // framings are cleared. The card warns about this before it is clicked.
  deferMode=(deferMode===mode)?null:mode;
  if(deferMode) selectedAngles=[];
  syncSelectionUI(false);
}

function updateCFCta(){
  var cta=document.getElementById("cf-build-cta");if(!cta)return;
  var arrow=' <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(deferMode==="explore"){
    cta.classList.add("visible");cta.innerHTML="Explore full potential"+arrow;
  }else if(selectedAngles.length){
    cta.classList.add("visible");
    var n=selectedAngles.length;
    cta.innerHTML=(n>1?'Build analysis with '+n+' scenarios':'Confirm &amp; build analysis')+arrow;
  }else{
    cta.classList.remove("visible");
  }
}

function proceedToAnalysis(){
  if(deferMode==="explore"){
    cfUser("Explore the full potential");
    setTimeout(function(){cfAgent("Good \u2014 no need to force a story yet. I'll map the full opportunity set across cost and revenue, and the case for change will come out of where the value actually is. You can lock a narrative any time once you've seen it. <span style=\"color:var(--g400)\">(prototype \u2014 this navigates to the Analysis screen)</span>");},450);
    sideAgent("Exploratory run \u2014 full potential first, narrative derived from results.");
    return;
  }
  if(!selectedAngles.length){cfAgent("Pick an angle, take a few forward, or use one of the options below and we'll settle the story after the numbers.");return;}
  var titles=selectedAngles.map(function(id){return ANGLES.find(function(x){return x.id===id;}).title;});
  if(selectedAngles.length===1){
    cfAgent("Locked. Building the analysis around <strong>"+titles[0].toLowerCase()+"</strong>\u2026 <span style=\"color:var(--g400)\">(prototype \u2014 this navigates to the Analysis screen)</span>");
  }else{
    cfAgent("Locked in <strong>"+selectedAngles.length+" scenarios</strong>: "+titles.join(", ")+". I'll build the analysis so you can compare them side by side\u2026 <span style=\"color:var(--g400)\">(prototype \u2014 this navigates to the Analysis screen)</span>");
  }
}

  cfAgent("<p>Before we put numbers to anything, let's settle the <strong>case for change</strong> — the \u201cwhy now\u201d that carries the whole story to the CFO.</p>");
  setTimeout(function(){
    cfAgent("<p>At setup you flagged three things: <strong>margin pressure</strong>, the rough <strong>$200M cost ambition</strong> the CFO floated, and protecting the <strong>DTC transition</strong>. Here's how each one carries into a case for change.</p>");
  },650);
  setTimeout(function(){
    cfAgent("<p>These aren't one story — they take <strong>different lenses</strong> on the why-now, which is the point. Two are a <strong>profitability</strong> case (below peers, and the three-year margin slide) — that's where your <strong>margin-pressure</strong> flag lands. One is a <strong>cash-to-growth</strong> case: pull cost out of the core to self-fund the direct and DTC push, so the <strong>DTC transition</strong> you flagged lives here. One is a <strong>value / defensive</strong> case: move first on efficiency before an activist forces it.</p><p>The <strong>$200M</strong> sits under whichever you pick — it's the prize the analysis will size, not a story on its own. Starting options, not a fixed list: keep the one that matches your read, take a few forward to test, or hold off until you've seen the analysis.</p>",true);
  },1400);
  sideAgent("Mined 14 sources: FY22\u2013FY24 10-Ks, 4 earnings transcripts, CEO &amp; chairman letters, UBS &amp; Morgan Stanley notes, recent press.");
  // suggestion floats
  var f=document.getElementById("cf-sug-float");
  if(f){
    f.className="cf-sug-float visible";
    f.innerHTML='<button class="cf-sug-float-btn" onclick="askFor(this)">Combine below-peer + fuel-growth</button>'+
      '<button class="cf-sug-float-btn" onclick="askFor(this)">Which resonates most with a CFO?</button>'+
      '<button class="cf-sug-float-btn" onclick="askFor(this)">Propose a different angle</button>';
  }
  // wire inputs
  var send=function(){var i=document.getElementById("cp-inp");if(i&&i.value.trim()){cfUser(i.value.trim());i.value="";setTimeout(function(){cfAgent("Good \u2014 I can redraft any of these around that, or work it into one of the four. Which way do you want to go?");},450);}};
  var _sb=document.getElementById("cp-send"); if(_sb)_sb.addEventListener("click",send);
  var _si=document.getElementById("cp-inp"); if(_si)_si.addEventListener("keydown",function(e){if(e.key==="Enter")send();});
}
function askFor(btn){cfUser(btn.textContent);setTimeout(function(){cfAgent("Good one. In a real run I'd redraft right here \u2014 for the prototype, pick an angle to keep going.");},450);}

document.addEventListener("DOMContentLoaded",initCFC);
</script>
<script>
function renderShareMembers(){
  var el=document.getElementById("share-list"); if(!el)return;
  el.innerHTML=COLLABORATORS.map(function(c,i){
    return '<div class="share-row">'+
      '<div class="share-av">'+c.in+'</div>'+
      '<div class="share-main"><div class="share-nm">'+c.nm+'</div><div class="share-role">'+c.role+'</div></div>'+
      '<select class="share-permsel" onchange="setPerm('+i+',this.value)"><option'+(c.perm==="Contributor"?" selected":"")+'>Contributor</option><option'+(c.perm==="Viewer"?" selected":"")+'>Viewer</option></select>'+
      (i>0?'<button class="share-rm" onclick="removeMember('+i+')" title="Remove"><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>':'<span style="width:22px;flex:none"></span>')+
    '</div>';
  }).join('');
}
function openShareModal(){ renderShareMembers(); document.getElementById("share-overlay").style.display="block"; document.getElementById("share-modal").style.display="block"; }
function closeShareModal(){ document.getElementById("share-overlay").style.display="none"; document.getElementById("share-modal").style.display="none"; }
function setPerm(i,v){ if(COLLABORATORS[i]){ COLLABORATORS[i].perm=v; buildCollaborators(); if(typeof logEntry==="function")logEntry("p","You",COLLABORATORS[i].nm+" set to <strong>"+v+"</strong>"); } }
function removeMember(i){ if(COLLABORATORS[i]){ var nm=COLLABORATORS[i].nm; COLLABORATORS.splice(i,1); renderShareMembers(); buildCollaborators(); if(typeof logEntry==="function")logEntry("p","You","Removed <strong>"+nm+"</strong> from the project"); } }
function addMember(){ var inp=document.getElementById("share-inp"),ps=document.getElementById("share-perm"); if(!inp||!inp.value.trim())return; var nm=inp.value.trim(); var initials=nm.split(/[\s@._-]+/).filter(Boolean).slice(0,2).map(function(w){return w[0].toUpperCase();}).join("")||"?"; COLLABORATORS.push({nm:nm,in:initials,role:"Invited",last:"Just invited",online:false,edits:0,perm:ps.value}); inp.value=""; renderShareMembers(); buildCollaborators(); if(typeof logEntry==="function")logEntry("p","You","Invited <strong>"+nm+"</strong> as "+ps.value); }
function copyShareLink(){ var b=event.target.closest("button"); if(!b)return; var t=b.innerHTML; b.innerHTML="Link copied \u2713"; setTimeout(function(){b.innerHTML=t;},1400); }

/* ── LOG FILTER ───────────────────────────────────────────── */
var _logFilter = "all";
function setLogFilter(f, btn) {
  _logFilter = f;
  var bar = document.getElementById("lg-filter-bar");
  if(bar) bar.querySelectorAll(".lg-fchip").forEach(function(b){ b.classList.toggle("on", b===btn); });
  applyLogFilter();
}
function applyLogFilter() {
  var list = document.getElementById("lg-list");
  if(!list) return;
  var entries = list.querySelectorAll(".lg-e");
  entries.forEach(function(el) {
    var type = el.dataset.type || "";
    var txt  = (el.dataset.txt || "").toLowerCase();
    var show = false;
    if(_logFilter === "all")      show = true;
    else if(_logFilter === "p")   show = type === "p";
    else if(_logFilter === "c")   show = type === "c";
    else if(_logFilter === "a")   show = type === "a";
    else if(_logFilter === "override") show = (type==="p"||type==="c") && /override|assumption|changed|updated|set to|removed|promoted|demoted|moved/i.test(txt);
    else if(_logFilter === "flag") show = type==="a" && /flag|warn|⚠|caution|recommend|watch|note|check/i.test(txt);
    el.classList.toggle("lg-hidden", !show);
  });
}

</script>
