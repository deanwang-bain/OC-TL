name: Sync Confluence

# GitHub-hosted runners can reach bainco.atlassian.net, which sandboxed Claude
# Code sessions cannot. Running the mirror here is what makes the OI30 space
# available to those sessions as committed files.

on:
  schedule:
    # 08:00 Singapore (UTC+8) = 00:00 UTC. Singapore has no daylight saving,
    # so this holds year-round.
    - cron: "0 0 * * *"
  workflow_dispatch: # allow a manual run from the Actions tab
    inputs:
      force_update:
        description: "Send the daily update even if no pages changed (for testing)"
        type: boolean
        default: false

concurrency:
  group: confluence-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # the daily update is filed as an assigned issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the digest diffs HEAD~1..HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install: the sync script is stdlib-only by design.
      - name: Sync and push
        env:
          CONFLUENCE_SITE: bainco.atlassian.net
          CONFLUENCE_SPACE: OI30
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          OUTPUT_DIR: confluence
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "confluence-sync[bot]"
          git config user.email "confluence-sync[bot]@users.noreply.github.com"

          # A push is rejected whenever someone lands a commit while this job
          # runs. The mirror is regenerated from Confluence on every run, so
          # rather than merging generated files, reset onto the new head and
          # sync again — the result is identical either way.
          for attempt in 1 2 3; do
            python3 tools/confluence_sync.py

            git add confluence
            if git diff --staged --quiet; then
              echo "No Confluence changes."
              echo "CHANGED=0" >> "$GITHUB_ENV"
              exit 0
            fi

            pages=$(git diff --staged --name-only -- confluence | grep -c '\.md$' || true)
            git commit -m "Sync OI30 from Confluence (${pages} page files changed)"

            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              # The digest diffs this commit, which is correct whether or not
              # the run had to reset onto a moved head partway through.
              echo "CHANGED=1" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Push rejected; resetting onto the current remote head."
            git fetch origin "${BRANCH}"
            git reset --hard FETCH_HEAD
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Send daily update
        # force_update lets a manual run exercise the email path on a day when
        # nothing changed, which is otherwise untestable.
        if: env.CHANGED == '1' || inputs.force_update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Singapore date +%Y-%m-%d)

          {
            echo "Daily Confluence update for the OI30 space, $today (Singapore time)."
            echo
            # On a forced run with nothing changed there is no sync commit to
            # diff, so compare HEAD with itself and let the digest fall back to
            # reporting standing state.
            if [ "${CHANGED:-0}" = "1" ]; then base="HEAD~1"; else base="HEAD"; fi
            python3 tools/digest.py "$base" HEAD
            echo
            echo "---"
            echo
            echo "[Sync commit]($GITHUB_SERVER_URL/$REPO/commit/$(git rev-parse HEAD)) · [Workflow run]($RUN_URL)"
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/digest.md

          # Always visible on the run page, needs no credentials and no inbox.
          cat /tmp/digest.md >> "$GITHUB_STEP_SUMMARY"

          # Filed as an assigned issue: GitHub emails the assignee, so this
          # needs no SMTP credentials in the repository.
          gh issue create \
            --repo "$REPO" \
            --title "Confluence update — $today" \
            --body-file /tmp/digest.md \
            --assignee "$ASSIGNEE"

          # Keep a durable copy in the repo so the briefing is greppable later
          # and not only reachable through a notification.
          mkdir -p context/daily
          cp /tmp/digest.md "context/daily/$today.md"
          git add context/daily
          if ! git diff --staged --quiet; then
            git commit -m "Daily briefing for $today"
            git push origin "HEAD:${BRANCH}" || echo "Briefing commit not pushed; issue was still created." >&2
          fi

      - name: Post to Teams
        # Optional. Skipped unless a channel webhook is configured, so the
        # workflow stays green without it.
        if: (env.CHANGED == '1' || inputs.force_update) && env.TEAMS_WEBHOOK != ''
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Singapore date +%Y-%m-%d)
          python3 - "$today" <<'PYEOF' > /tmp/card.json
          import json, sys
          body = open("context/daily/%s.md" % sys.argv[1], encoding="utf-8").read()
          # Teams renders a subset of markdown; the briefing is already markdown.
          print(json.dumps({
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [{"type": "TextBlock", "wrap": True, "text": body}],
                  },
              }],
          }))
          PYEOF
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
            --data @/tmp/card.json "$TEAMS_WEBHOOK"
