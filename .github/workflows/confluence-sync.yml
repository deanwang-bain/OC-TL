name: Sync Confluence

# GitHub-hosted runners can reach bainco.atlassian.net, which sandboxed Claude
# Code sessions cannot. Running the mirror here is what makes the OI30 space
# available to those sessions as committed files.

on:
  schedule:
    # 08:00 Singapore (UTC+8) = 00:00 UTC. Singapore has no daylight saving,
    # so this holds year-round.
    - cron: "0 0 * * *"
  workflow_dispatch: # allow a manual run from the Actions tab

concurrency:
  group: confluence-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # the daily update is filed as an assigned issue

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the digest diffs HEAD~1..HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install: the sync script is stdlib-only by design.
      - name: Sync and push
        env:
          CONFLUENCE_SITE: bainco.atlassian.net
          CONFLUENCE_SPACE: OI30
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          OUTPUT_DIR: confluence
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "confluence-sync[bot]"
          git config user.email "confluence-sync[bot]@users.noreply.github.com"

          # A push is rejected whenever someone lands a commit while this job
          # runs. The mirror is regenerated from Confluence on every run, so
          # rather than merging generated files, reset onto the new head and
          # sync again — the result is identical either way.
          for attempt in 1 2 3; do
            python3 tools/confluence_sync.py

            git add confluence
            if git diff --staged --quiet; then
              echo "No Confluence changes."
              echo "CHANGED=0" >> "$GITHUB_ENV"
              exit 0
            fi

            pages=$(git diff --staged --name-only -- confluence | grep -c '\.md$' || true)
            git commit -m "Sync OI30 from Confluence (${pages} page files changed)"

            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt ${attempt}."
              # The digest diffs this commit, which is correct whether or not
              # the run had to reset onto a moved head partway through.
              echo "CHANGED=1" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Push rejected; resetting onto the current remote head."
            git fetch origin "${BRANCH}"
            git reset --hard FETCH_HEAD
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Send daily update
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Singapore date +%Y-%m-%d)

          {
            echo "Daily Confluence update for the OI30 space, $today (Singapore time)."
            echo
            python3 tools/digest.py HEAD~1 HEAD
            echo
            echo "---"
            echo
            echo "[Sync commit]($GITHUB_SERVER_URL/$REPO/commit/$(git rev-parse HEAD)) · [Workflow run]($RUN_URL)"
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/digest.md

          # Filed as an assigned issue: GitHub emails the assignee, so this
          # needs no SMTP credentials in the repository.
          gh issue create \
            --repo "$REPO" \
            --title "Confluence update — $today" \
            --body-file /tmp/digest.md \
            --assignee "$ASSIGNEE"
